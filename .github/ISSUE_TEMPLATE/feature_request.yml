name: Feature request
description: Suggest an app to protect or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's the problem
      description: What are you trying to keep off your stream, or what's clunky right now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your idea. If it's a new app preset, include the exact process name (e.g. Signal.exe).
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - New app preset
        - New mask mode / protection behavior
        - UI / setup improvement
        - OBS / streaming integration
        - Something else
    validations:
      required: false
